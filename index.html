<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የእኔ ዌብሳይት - የተስተካከለ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #34495e;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        nav a:hover {
            background-color: #1abc9c;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
        }
        p {
            line-height: 1.6;
            color: #555;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #2c3e50;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>እንኳን ወደ ፊትኤንድ ፕሮጀክታችን በደህና መጡ!</h1>
    </header>

    <nav>
        <a href="#">መነሻ</a>
        <a href="#">ስለ እኛ</a>
        <a href="#">አገልግሎቶች</a>
        <a href="#">ያግኙን</a>
    </nav>

    <div class="container">
        <h2>የተስተካከለ ገጽ (Updated Page)</h2>
        <p>ይህ ፋይል በ <strong>frontend</strong> ብራንች ተሻሽሎ በቀጥታ በድር-ገጽ (GitHub Web Editor) ሊስተካከል የሚችል ጥራት ያለው የ HTML ቴምፕሌት ነው።</p>
        <a href="#" class="btn">ተጨማሪ አንብብ</a>
    </div>

    <footer>
        <p>&copy; 2026 - ሁሉም መብቱ የተጠበቀ ነው።</p>
    </footer>

</body>
</html>
